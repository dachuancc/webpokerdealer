[project]
name = "webpokerdealer"
version = "0.1.0"
description = "Web-based Texas Hold'em dealer for home games: deal hole cards to players' phones, show community cards on a shared board device."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "treys>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webpokerdealer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认跳过 slow（穷举级）；跑法：uv run pytest -m slow
addopts = "-q -m 'not slow'"
# Blocking WebSocket reads would otherwise hang the suite forever.
timeout = 30
markers = [
    "slow: 穷举级测试，实测约 15 秒，默认不跑（uv run pytest -m slow）",
]
