<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <title>{% block title %}Web Poker Dealer{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  {% block content %}{% endblock %}
  <div id="toast" class="toast" hidden></div>
  <div id="card-zoom" class="card-zoom" hidden aria-label="放大的牌"></div>
  <script src="/static/js/common.js?v={{ asset_v }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
